<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Store - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: '#10b981',
                        accent: '#f59e0b',
                        background: {
                            light: '#f8fafc',
                            dark: '#020617',
                        },
                        card: {
                            light: '#ffffff',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #f8fafc;
            --fg: #020617;
            --border: #e2e8f0;
            --card: #ffffff;
            --input-bg: #ffffff;
        }
        .dark {
            --bg: #020617;
            --fg: #f8fafc;
            --border: #1e293b;
            --card: #0f172a;
            --input-bg: #1e293b;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            transition: background-color 0.3s, color 0.3s;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-md space-y-8 rounded-2xl border border-[var(--border)] bg-[var(--card)] p-8 shadow-2xl transition-all hover:shadow-primary-500/10">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-600 text-white mb-4 shadow-lg shadow-primary-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h.01M9 9h.01M15 15h.01M18 12h.01M12 12h.01M3 6v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2Z"/><path d="M9 15h6"/></svg>
            </div>
            <h1 id="title" class="text-4xl font-extrabold tracking-tight text-primary-500">GAMER STORE</h1>
            <p id="subtitle" class="text-[var(--fg)] opacity-70">Login to your account</p>
        </div>

        <form class="mt-8 space-y-6" id="loginForm">
            <div class="space-y-4">
                <div>
                    <label id="emailLabel" for="email" class="block text-sm font-semibold mb-1">Email</label>
                    <input id="email" type="email" required class="block w-full rounded-lg border border-[var(--border)] bg-[var(--input-bg)] px-4 py-3 text-[var(--fg)] placeholder:opacity-50 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all">
                </div>
                <div>
                    <label id="passwordLabel" for="password" class="block text-sm font-semibold mb-1">Password</label>
                    <input id="password" type="password" required class="block w-full rounded-lg border border-[var(--border)] bg-[var(--input-bg)] px-4 py-3 text-[var(--fg)] placeholder:opacity-50 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full rounded-lg bg-primary-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-primary-500/30 hover:bg-primary-700 hover:shadow-primary-500/40 transform hover:-translate-y-0.5 active:translate-y-0 transition-all">Login</button>
        </form>

        <div class="text-center space-y-4 pt-4">
            <p class="text-sm opacity-70">
                <span id="noAccount">Don't have an account?</span>
                <a href="register.html" id="registerLink" class="font-bold text-primary-500 hover:text-primary-600 transition-colors">Register</a>
            </p>

            <div class="flex justify-center gap-4 pt-4 border-t border-[var(--border)]">
                <button onclick="toggleLang()" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--border)] transition-colors text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    <span>AR / EN</span>
                </button>
                <button onclick="toggleTheme()" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-[var(--border)] hover:bg-[var(--border)] transition-colors text-sm font-medium">
                    <svg id="sunIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M22 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>
                    <svg id="moonIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <span id="themeLabel">Mode</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: 'GAMER STORE',
                subtitle: 'Login to your account',
                emailLabel: 'Email',
                passwordLabel: 'Password',
                submitBtn: 'Login',
                noAccount: "Don't have an account?",
                registerLink: 'Register',
                error: 'Invalid credentials',
                theme: 'Theme'
            },
            ar: {
                title: 'متجر الجيمرز',
                subtitle: 'سجل دخول لحسابك',
                emailLabel: 'البريد الإلكتروني',
                passwordLabel: 'كلمة المرور',
                submitBtn: 'تسجيل الدخول',
                noAccount: 'ليس لديك حساب؟',
                registerLink: 'سجل الآن',
                error: 'بيانات الاعتماد غير صالحة',
                theme: 'المظهر'
            }
        };

        let lang = localStorage.getItem('lang') || 'en';
        let theme = localStorage.getItem('theme') || 'dark';

        function updateUI() {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.documentElement.className = theme;

            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('submitBtn').textContent = t.submitBtn;
            document.getElementById('noAccount').textContent = t.noAccount;
            document.getElementById('registerLink').textContent = t.registerLink;
            document.getElementById('themeLabel').textContent = t.theme;

            if (theme === 'dark') {
                document.getElementById('sunIcon').classList.remove('hidden');
                document.getElementById('moonIcon').classList.add('hidden');
            } else {
                document.getElementById('sunIcon').classList.add('hidden');
                document.getElementById('moonIcon').classList.remove('hidden');
            }
        }

        function toggleLang() {
            lang = lang === 'en' ? 'ar' : 'en';
            localStorage.setItem('lang', lang);
            updateUI();
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            updateUI();
        }

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'welcome.html';
            } else {
                alert(translations[lang].error);
            }
        };

        updateUI();
    </script>
</body>
</html>
