<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        :root { --bg: #ffffff; --fg: #020817; --border: #e2e8f0; --card: #ffffff; }
        .dark { --bg: #020817; --fg: #f8fafc; --border: #1e293b; --card: #0f172a; }
        body { background-color: var(--bg); color: var(--fg); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="sticky top-0 z-50 w-full border-b border-[var(--border)] bg-[var(--bg)]/80 backdrop-blur">
        <div class="container mx-auto flex h-16 items-center justify-between px-4">
            <div class="font-bold text-xl">GAMER STORE</div>
            <div class="flex items-center gap-4">
                <button onclick="toggleLang()" class="p-2 border rounded">AR/EN</button>
                <button onclick="toggleTheme()" class="p-2 border rounded">Theme</button>
                <a href="cart.html" class="relative p-2 border rounded">
                    🛒 <span id="cartCount" class="absolute -top-1 -right-1 bg-primary text-[10px] rounded-full px-1">0</span>
                </a>
                <button onclick="logout()" class="p-2 border rounded text-red-500">Exit</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-4 mb-8 items-center justify-between">
            <h1 id="storeTitle" class="text-3xl font-bold">Store</h1>
            <input type="text" id="search" placeholder="Search..." oninput="render()" class="border border-[var(--border)] bg-transparent p-2 rounded w-full md:w-64">
        </div>
        <div id="products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const products = [
            { id: 1, name: 'Cyberpunk 2077', price: 59.99, image: 'https://images.unsplash.com/photo-1605898918448-43093296c093?auto=format&fit=crop&w=400&q=80', category: 'Games' },
            { id: 2, name: 'RTX 4090', price: 1599.99, image: 'https://images.unsplash.com/photo-1591405351990-4726e331f141?auto=format&fit=crop&w=400&q=80', category: 'Hardware' },
            { id: 3, name: 'Mechanical Keyboard', price: 129.99, image: 'https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?auto=format&fit=crop&w=400&q=80', category: 'Accessories' },
            { id: 4, name: 'Elden Ring', price: 49.99, image: 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=400&q=80', category: 'Games' }
        ];

        let lang = localStorage.getItem('lang') || 'en';
        let theme = localStorage.getItem('theme') || 'dark';
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        function updateUI() {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.className = theme;
            document.getElementById('cartCount').textContent = cart.length;
            document.getElementById('storeTitle').textContent = lang === 'ar' ? 'المتجر' : 'Store';
        }

        function toggleLang() { lang = lang === 'en' ? 'ar' : 'en'; localStorage.setItem('lang', lang); updateUI(); render(); }
        function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', theme); updateUI(); }
        function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            localStorage.setItem('cart', JSON.stringify(cart));
            updateUI();
        }

        function render() {
            const query = document.getElementById('search').value.toLowerCase();
            const container = document.getElementById('products');
            container.innerHTML = products.filter(p => p.name.toLowerCase().includes(query)).map(p => `
                <div class="border border-[var(--border)] rounded-lg overflow-hidden bg-[var(--card)]">
                    <img src="${p.image}" class="h-48 w-full object-cover">
                    <div class="p-4">
                        <h3 class="font-bold">${p.name}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-primary font-bold">$${p.price}</span>
                            <button onclick="addToCart(${p.id})" class="bg-primary text-white p-2 rounded text-xs">Add</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        updateUI();
        render();
    </script>
</body>
</html>
