<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Store - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #020817;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        .dark {
            --bg: #020817;
            --fg: #f8fafc;
            --border: #1e293b;
            --card: #0f172a;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md space-y-8 rounded-lg border border-[var(--border)] bg-[var(--card)] p-8 shadow-lg">
        <div class="text-center">
            <h2 id="title" class="text-3xl font-bold tracking-tight">Register</h2>
        </div>
        <form class="mt-8 space-y-6" id="registerForm">
            <div class="space-y-4">
                <div>
                    <label id="nameLabel" for="name" class="block text-sm font-medium">Name</label>
                    <input id="name" type="text" required class="mt-1 block w-full rounded-md border border-[var(--border)] bg-transparent px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary">
                </div>
                <div>
                    <label id="emailLabel" for="email" class="block text-sm font-medium">Email</label>
                    <input id="email" type="email" required class="mt-1 block w-full rounded-md border border-[var(--border)] bg-transparent px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary">
                </div>
                <div>
                    <label id="passwordLabel" for="password" class="block text-sm font-medium">Password</label>
                    <input id="password" type="password" required class="mt-1 block w-full rounded-md border border-[var(--border)] bg-transparent px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="w-full rounded-md bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary/90">Register</button>
        </form>
        <div class="text-center">
            <p class="text-sm text-gray-500">
                <span id="haveAccount">Already have an account?</span>
                <a href="login.html" id="loginLink" class="font-medium text-primary hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Register",
                nameLabel: "Name",
                emailLabel: "Email",
                passwordLabel: "Password",
                submitBtn: "Register",
                haveAccount: "Already have an account?",
                loginLink: "Login"
            },
            ar: {
                title: "إنشاء حساب",
                nameLabel: "الاسم",
                emailLabel: "البريد الإلكتروني",
                passwordLabel: "كلمة المرور",
                submitBtn: "إنشاء",
                haveAccount: "لديك حساب بالفعل؟",
                loginLink: "دخول"
            }
        };

        let lang = localStorage.getItem('lang') || 'en';
        let theme = localStorage.getItem('theme') || 'dark';

        function updateUI() {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.documentElement.className = theme;

            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('nameLabel').textContent = t.nameLabel;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('submitBtn').textContent = t.submitBtn;
            document.getElementById('haveAccount').textContent = t.haveAccount;
            document.getElementById('loginLink').textContent = t.loginLink;
        }

        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const newUser = { id: Date.now(), name, email, password };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            window.location.href = 'welcome.html';
        };

        updateUI();
    </script>
</body>
</html>
