<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Store - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --bg: #ffffff; --fg: #020817; }
        .dark { --bg: #020817; --fg: #f8fafc; }
        body { background-color: var(--bg); color: var(--fg); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="text-center space-y-8 animate-pulse">
        <h1 id="greeting" class="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-purple-600">
        </h1>
        <button onclick="location.href='store.html'" id="enterBtn" class="px-8 py-3 bg-primary text-white rounded-full text-xl font-bold hover:scale-105 transition-transform shadow-lg">
            Enter Store
        </button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user) window.location.href = 'login.html';

        const lang = localStorage.getItem('lang') || 'en';
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.className = theme;

        const translations = {
            en: { greeting: `Hello, ${user?.name}! Welcome to the store.`, enterBtn: "Enter Store" },
            ar: { greeting: `أهلاً ${user?.name}! مرحبًا بك في المتجر.`, enterBtn: "دخول المتجر" }
        };

        document.getElementById('greeting').textContent = translations[lang].greeting;
        document.getElementById('enterBtn').textContent = translations[lang].enterBtn;
    </script>
</body>
</html>
