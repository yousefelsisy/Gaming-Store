<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Store - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #020817;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        .dark {
            --bg: #020817;
            --fg: #f8fafc;
            --border: #1e293b;
            --card: #0f172a;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md space-y-8 rounded-lg border border-[var(--border)] bg-[var(--card)] p-8 shadow-lg">
        <div class="text-center">
            <h2 id="title" class="text-3xl font-bold tracking-tight">Login</h2>
        </div>
        <form class="mt-8 space-y-6" id="loginForm">
            <div class="space-y-4">
                <div>
                    <label id="emailLabel" for="email" class="block text-sm font-medium">Email</label>
                    <input id="email" type="email" required class="mt-1 block w-full rounded-md border border-[var(--border)] bg-transparent px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary">
                </div>
                <div>
                    <label id="passwordLabel" for="password" class="block text-sm font-medium">Password</label>
                    <input id="password" type="password" required class="mt-1 block w-full rounded-md border border-[var(--border)] bg-transparent px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="w-full rounded-md bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary/90">Login</button>
        </form>
        <div class="text-center">
            <p class="text-sm text-gray-500">
                <span id="noAccount">Don't have an account?</span>
                <a href="register.html" id="registerLink" class="font-medium text-primary hover:underline">Register</a>
            </p>
        </div>
        <div class="flex justify-center gap-4 mt-6">
            <button onclick="toggleLang()" class="text-xs border border-[var(--border)] px-2 py-1 rounded">AR / EN</button>
            <button onclick="toggleTheme()" class="text-xs border border-[var(--border)] px-2 py-1 rounded">Mode</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Login",
                emailLabel: "Email",
                passwordLabel: "Password",
                submitBtn: "Login",
                noAccount: "Don't have an account?",
                registerLink: "Register",
                error: "Invalid credentials"
            },
            ar: {
                title: "تسجيل الدخول",
                emailLabel: "البريد الإلكتروني",
                passwordLabel: "كلمة المرور",
                submitBtn: "دخول",
                noAccount: "ليس لديك حساب؟",
                registerLink: "إنشاء حساب",
                error: "بيانات غير صحيحة"
            }
        };

        let lang = localStorage.getItem('lang') || 'en';
        let theme = localStorage.getItem('theme') || 'dark';

        function updateUI() {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.documentElement.className = theme;

            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('submitBtn').textContent = t.submitBtn;
            document.getElementById('noAccount').textContent = t.noAccount;
            document.getElementById('registerLink').textContent = t.registerLink;
        }

        function toggleLang() {
            lang = lang === 'en' ? 'ar' : 'en';
            localStorage.setItem('lang', lang);
            updateUI();
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            updateUI();
        }

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'welcome.html';
            } else {
                alert(translations[lang].error);
            }
        };

        updateUI();
    </script>
</body>
</html>
